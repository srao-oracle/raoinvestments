app = "raoinvestments-worker"
primary_region = "iad" # us-east-1, matches the Supabase project region

# Deploy from repo root with an explicit context + dockerfile so the image can
# bundle apps/web/lib:
#   fly deploy . -c apps/worker/fly.toml --dockerfile apps/worker/Dockerfile --remote-only

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1 # always-on: the single upstream Massive socket lives here

  [[http_service.checks]]
    grace_period = "20s"
    interval = "20s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
